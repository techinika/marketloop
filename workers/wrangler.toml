name = "marketloop-workers"
main = "src/index.ts"
compatibility_date = "2026-08-13"

# --- Cron: auto-refund orders still "held" past their 5-day delivery deadline ---
[triggers]
crons = ["0 * * * *"]

# --- R2: product images / videos ---
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "marketloop-images"

# --- KV: phone-verification OTP codes ---
# Create a namespace in the Cloudflare dashboard (Workers & Pages -> KV) and
# paste its id here; `preview_id` is used by `wrangler dev` / `wrangler types`.
[[kv_namespaces]]
binding = "OTP_KV"
id = "d0e2ba7e799742e4aa9cf55d3d0f3aab"
preview_id = "d0e2ba7e799742e4aa9cf55d3d0f3aab"

# --- Vars (non-secret) ---
[vars]
FIREBASE_PROJECT_ID = "marketloop-rw"
R2_ACCOUNT_ID = ""
R2_BUCKET_NAME = "marketloop-images"
FRONTEND_URL = "https://marketloop.techinika.com"

# --- Secrets ---
# Never commit secret values. Set them via `wrangler secret put <NAME>` for
# deployed environments, or locally in `.dev.vars` (see `.dev.vars.example`).
#
# FIREBASE_CLIENT_EMAIL
# FIREBASE_PRIVATE_KEY
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# PAYPACK_CLIENT_ID
# PAYPACK_CLIENT_SECRET
# PAYPACK_WEBHOOK_SECRET
# PESAPAL_CONSUMER_KEY
# PESAPAL_CONSUMER_SECRET


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
